<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Legal QA</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app" id="app">
      <aside class="sidebar" id="sidebar" aria-label="Sidebar">
        <div class="sidebar-top">
          <button type="button" class="sidebar-toggle" id="sidebar-toggle" title="Thu gọn sidebar">
            <svg class="icon-open" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="18" height="18" rx="2" />
              <path d="M9 3v18" />
            </svg>
            <svg class="icon-close" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="18" height="18" rx="2" />
              <path d="M9 3v18" />
            </svg>
          </button>
        </div>

        <div class="sidebar-actions">
          <button type="button" class="sidebar-item" id="new-chat-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 5v14M5 12h14" />
            </svg>
            <span class="sidebar-label">Cuộc trò chuyện mới</span>
          </button>
          <button type="button" class="sidebar-item" id="search-chats-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="7" />
              <path d="M20 20l-3-3" />
            </svg>
            <span class="sidebar-label">Tìm kiếm</span>
          </button>
        </div>

        <div class="sidebar-search hidden" id="sidebar-search">
          <input type="text" id="search-input" placeholder="Tìm cuộc trò chuyện..." />
        </div>

        <div class="sidebar-filters">
          <div class="sidebar-section-label">Tùy chọn tra cứu</div>
          <div class="field">
            <label for="as-of">Ngày hiệu lực</label>
            <input type="date" id="as-of" />
            <p class="field-hint">Mặc định: hôm nay. Xóa ngày = không lọc hiệu lực.</p>
          </div>
          <div class="field">
            <label for="document-number">Số hiệu văn bản</label>
            <input type="text" id="document-number" placeholder="VD: 02/2026/QH16" />
          </div>
          <div class="field">
            <label for="top-k">Top K</label>
            <input type="number" id="top-k" value="5" min="1" max="20" />
          </div>
        </div>

        <div class="sidebar-recents">
          <div class="sidebar-section-label">Gần đây</div>
          <div class="recents-list" id="recents-list"></div>
        </div>

        <div class="sidebar-footer">
          <div class="user-chip">
            <div class="user-avatar">LQ</div>
            <span class="sidebar-label user-name">Legal QA</span>
          </div>
        </div>
      </aside>

      <div class="main">
        <header class="topbar">
          <button type="button" class="topbar-sidebar-btn" id="topbar-sidebar-btn" title="Mở sidebar">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="18" height="18" rx="2" />
              <path d="M9 3v18" />
            </svg>
          </button>
          <button type="button" class="model-name" id="model-name">Legal QA</button>
          <div class="topbar-status">
            <span id="status-dot" class="status-dot"></span>
            <span id="status-text">Đang kết nối...</span>
          </div>
        </header>

        <div class="chat-view is-empty" id="chat-view">
          <div id="messages" class="messages"></div>

          <div class="composer-area" id="composer-area">
            <div id="welcome-hero" class="welcome-hero">
              <h1>Tôi có thể giúp gì?</h1>
            </div>

            <div id="error-banner" class="error-banner"></div>

            <div class="composer-shell">
              <form id="chat-form" class="composer-form">
                <textarea
                  id="message-input"
                  rows="1"
                  placeholder="Hỏi điều gì về pháp luật..."
                  autocomplete="off"
                ></textarea>
                <button type="submit" class="send-btn" id="send-btn" title="Gửi" disabled>
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 2a1 1 0 0 1 .9.6l2.8 6.3 6.3 2.8a1 1 0 0 1 0 1.8l-6.3 2.8-2.8 6.3a1 1 0 0 1-1.8 0l-2.8-6.3-6.3-2.8a1 1 0 0 1 0-1.8l6.3-2.8 2.8-6.3A1 1 0 0 1 12 2z" />
                  </svg>
                </button>
              </form>

              <div class="quick-actions" id="quick-actions"></div>
            </div>

            <p class="composer-disclaimer">
              Kết quả chỉ mang tính tham khảo, không thay tư vấn pháp lý chính thức.
            </p>
          </div>
        </div>
      </div>
    </div>

    <script src="config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
